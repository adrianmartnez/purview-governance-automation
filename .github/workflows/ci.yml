# Required status check job names (ruleset Protect main):
# lint, unit-tests, package-validation, api-contract-tests, cli-integration
#
# Action SHAs are pinned for immutability (supply-chain risk reduction vs moving tags).

name: ci

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install package with dev tools
        run: pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install package with dev tools
        run: pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest -m "not api_contract"

  package-validation:
    name: package-validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: pip install -e ".[dev]"

      - name: Build wheel and sdist
        run: python -m build

      - name: Validate artifacts, clean-wheel smoke, and sdist rebuild
        run: |
          set -euo pipefail
          EXPECTED_VERSION="1.1.0"
          WHL=$(ls dist/purview_governance_automation-${EXPECTED_VERSION}-*.whl)
          SDIST=$(ls dist/purview_governance_automation-${EXPECTED_VERSION}.tar.gz)
          test -f "$WHL"
          test -f "$SDIST"

          SDIST_DIR=$(mktemp -d)
          tar -xf "$SDIST" -C "$SDIST_DIR"
          ROOT=$(echo "$SDIST_DIR"/purview_governance_automation-*)
          test -f "$ROOT/pyproject.toml"
          test -f "$ROOT/README.md"
          test -f "$ROOT/LICENSE"
          test -f "$ROOT/src/purview_governance/__init__.py"
          test -f "$ROOT/src/purview_governance/cli.py"
          test -f "$ROOT/src/purview_governance/__main__.py"
          test -f "$ROOT/src/purview_governance/config/schemas/purview_governance_config_v1.json"
          test -f "$ROOT/src/purview_governance/config/schemas/purview_governance_config_v2.json"
          test -f "$ROOT/src/purview_governance/remote_state/schemas/purview_remote_state_v1.json"
          test -f "$ROOT/src/purview_governance/remote_state/schemas/purview_remote_state_v2.json"
          test -f "$ROOT/src/purview_governance/plan/schemas/purview_governance_plan_v1.json"
          test -f "$ROOT/src/purview_governance/plan/schemas/purview_governance_plan_v2.json"
          test -f "$ROOT/src/purview_governance/apply/schemas/purview_execution_result_v1.json"
          test -f "$ROOT/src/purview_governance/apply/schemas/purview_execution_result_v2.json"
          test -f "$ROOT/examples/fictional-governance-config.yaml"
          test -f "$ROOT/examples/fictional-governance-config-v2.yaml"

          python -m venv "$RUNNER_TEMP/venv-wheel"
          # shellcheck disable=SC1091
          source "$RUNNER_TEMP/venv-wheel/bin/activate"
          pip install "$WHL"
          SMOKE_DIR=$(mktemp -d)
          (
            cd "$SMOKE_DIR"
            python -c "import purview_governance, importlib.metadata as m; v=m.version('purview-governance-automation'); assert purview_governance.__version__ == v == '${EXPECTED_VERSION}', (purview_governance.__version__, v)"
            python -c "from purview_governance.config.schema import load_v1_schema; s=load_v1_schema(); assert s['\$id'].endswith('/purview-governance-config/v1'), s.get('\$id'); print('schema-ok', s['\$id'])"
            python -c "from purview_governance.remote_state import load_remote_state_v1_schema, build_remote_state; s=load_remote_state_v1_schema(); assert s['\$id'].endswith('/purview-remote-state/v1'), s.get('\$id'); rs=build_remote_state((), ()); assert rs.material_state_identity.startswith('sha256:'); print('remote-state-ok', s['\$id'], rs.material_state_identity)"
            python -c "from purview_governance.plan import load_plan_v1_schema, build_governance_plan, load_plan_text; from purview_governance.config import validate_config_text; from purview_governance.remote_state import build_remote_state; import json; s=load_plan_v1_schema(); assert s['\$id'].endswith('/purview-governance-plan/v1'), s.get('\$id'); cfg=validate_config_text('apiVersion: purview-governance-config/v1\ntarget:\n  endpoint: https://account.purview.azure.com\nauthentication:\n  strategy: defaultAzureCredential\nresources: []\n', format_hint='yaml'); plan=build_governance_plan(cfg, build_remote_state((), ())); canonical=plan.to_canonical_json(); loaded=load_plan_text(canonical); assert loaded.to_canonical_json()==canonical; pretty=json.dumps(json.loads(canonical), indent=2, ensure_ascii=False); loaded_pretty=load_plan_text(pretty); assert loaded_pretty.to_canonical_json()==canonical; print('plan-ok', s['\$id'], plan.plan_identity)"
            python -c "from purview_governance.apply import load_execution_result_v1_schema, ExecutionMode, load_execution_result_text, build_execution_result_from_parts; import json; s=load_execution_result_v1_schema(); assert s['\$id'].endswith('/purview-execution-result/v1'), s.get('\$id'); assert ExecutionMode.DRY_RUN.value=='dry-run'; h='sha256:'+('a'*64); r=build_execution_result_from_parts(plan_identity=h, planned_target_context_identity=h, execution_target_context_identity=h, planned_remote_state_identity=h, observed_remote_state_identity=h, mode=ExecutionMode.DRY_RUN, status='dry-run-ready', writes_performed=0, writes_attempted=0, writes_unknown=0, operations=(), failure=None); canonical=r.to_canonical_json(); loaded=load_execution_result_text(canonical); assert loaded.to_canonical_json()==canonical; pretty=json.dumps(json.loads(canonical), indent=2, ensure_ascii=False); loaded_pretty=load_execution_result_text(pretty); assert loaded_pretty.to_canonical_json()==canonical; assert loaded.result_identity==r.result_identity; print('apply-ok', s['\$id'], r.result_identity)"
            python -c "from purview_governance.apply import load_execution_result_v2_schema, ExecutionMode, load_execution_result_text, build_execution_result_v2_from_parts, OperationResultV2; s=load_execution_result_v2_schema(); assert s['\$id'].endswith('/purview-execution-result/v2'), s.get('\$id'); h='sha256:'+('c'*64); ops=(OperationResultV2(sequence=1, resource_type='scan', name='DailyScan', action='create', status='not-run', data_source_name='ds-a'), OperationResultV2(sequence=2, resource_type='scan', name='DailyScan', action='create', status='not-run', data_source_name='ds-b')); r=build_execution_result_v2_from_parts(plan_identity=h, planned_target_context_identity=h, execution_target_context_identity=h, planned_remote_state_identity=h, observed_remote_state_identity=h, mode=ExecutionMode.DRY_RUN, status='dry-run-ready', writes_performed=0, writes_attempted=0, writes_unknown=0, operations=ops, failure=None); canonical=r.to_canonical_json(); loaded=load_execution_result_text(canonical); assert loaded.to_canonical_json()==canonical; assert loaded.api_version.endswith('/v2'); assert {(o.data_source_name, o.name) for o in loaded.operations}=={('ds-a','DailyScan'),('ds-b','DailyScan')}; print('apply-v2-ok', s['\$id'], r.result_identity)"
            python -c "import httpx; from purview_governance.scanning import PurviewScanningClient, SCANNING_API_VERSION; assert SCANNING_API_VERSION == '2023-09-01'; print('scanning-ok', PurviewScanningClient.__name__, httpx.__version__)"
          )
          deactivate

          python -m venv "$RUNNER_TEMP/venv-sdist-build"
          # shellcheck disable=SC1091
          source "$RUNNER_TEMP/venv-sdist-build/bin/activate"
          pip install build
          (
            cd "$ROOT"
            python -m build
          )
          SDIST_WHL=$(ls "$ROOT"/dist/purview_governance_automation-${EXPECTED_VERSION}-*.whl)
          deactivate

          python -m venv "$RUNNER_TEMP/venv-sdist-wheel"
          # shellcheck disable=SC1091
          source "$RUNNER_TEMP/venv-sdist-wheel/bin/activate"
          pip install "$SDIST_WHL"
          SMOKE2=$(mktemp -d)
          (
            cd "$SMOKE2"
            python -c "import purview_governance, importlib.metadata as m; v=m.version('purview-governance-automation'); assert purview_governance.__version__ == v == '${EXPECTED_VERSION}', (purview_governance.__version__, v)"
            python -c "from purview_governance.config.schema import load_v1_schema; load_v1_schema(); print('sdist-schema-ok')"
            python -c "from purview_governance.remote_state import load_remote_state_v1_schema, build_remote_state; load_remote_state_v1_schema(); rs=build_remote_state((), ()); assert rs.material_state_identity.startswith('sha256:'); print('sdist-remote-state-ok')"
            python -c "from purview_governance.plan import load_plan_v1_schema, build_governance_plan, load_plan_text; from purview_governance.config import validate_config_text; from purview_governance.remote_state import build_remote_state; load_plan_v1_schema(); cfg=validate_config_text('apiVersion: purview-governance-config/v1\ntarget:\n  endpoint: https://account.purview.azure.com\nauthentication:\n  strategy: defaultAzureCredential\nresources: []\n', format_hint='yaml'); plan=build_governance_plan(cfg, build_remote_state((), ())); canonical=plan.to_canonical_json(); loaded=load_plan_text(canonical); assert loaded.to_canonical_json()==canonical; print('sdist-plan-ok', plan.plan_identity)"
            python -c "from purview_governance.apply import load_execution_result_v1_schema, ExecutionMode, load_execution_result_text, build_execution_result_from_parts; import json; s=load_execution_result_v1_schema(); assert s['\$id'].endswith('/purview-execution-result/v1'); h='sha256:'+('b'*64); r=build_execution_result_from_parts(plan_identity=h, planned_target_context_identity=h, execution_target_context_identity=h, planned_remote_state_identity=h, observed_remote_state_identity=h, mode=ExecutionMode.DRY_RUN, status='dry-run-ready', writes_performed=0, writes_attempted=0, writes_unknown=0, operations=(), failure=None); canonical=r.to_canonical_json(); loaded=load_execution_result_text(canonical); assert loaded.to_canonical_json()==canonical; print('sdist-apply-ok', s['\$id'], r.result_identity)"
            python -c "from purview_governance.apply import load_execution_result_v2_schema; s=load_execution_result_v2_schema(); assert s['\$id'].endswith('/purview-execution-result/v2'); print('sdist-apply-v2-ok', s['\$id'])"
            python -c "import httpx; from purview_governance.scanning import PurviewScanningClient; print('sdist-scanning-ok', PurviewScanningClient.__name__, httpx.__version__)"
          )

  api-contract-tests:
    name: api-contract-tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install package with dev tools
        run: pip install -e ".[dev]"

      # Offline real-HTTP contract tests against a deterministic loopback server.
      # Does not contact Microsoft Purview or require Azure credentials.
      - name: Run offline Purview API contract tests
        run: pytest -m api_contract

  cli-integration:
    name: cli-integration
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: pip install build

      - name: Build wheel
        run: python -m build

      - name: Install wheel and exercise CLI from temp directory
        run: |
          set -euo pipefail
          EXPECTED_VERSION="1.1.0"
          WHL=$(ls dist/purview_governance_automation-${EXPECTED_VERSION}-*.whl)
          python -m venv "$RUNNER_TEMP/venv-cli"
          # shellcheck disable=SC1091
          source "$RUNNER_TEMP/venv-cli/bin/activate"
          pip install "$WHL"
          SMOKE_DIR=$(mktemp -d)
          cd "$SMOKE_DIR"
          purview-governance --version | grep -F "purview-governance ${EXPECTED_VERSION}"
          purview-governance --help | grep -F "purview-governance"
          python -m purview_governance --version | grep -F "purview-governance ${EXPECTED_VERSION}"
          python -m purview_governance --help | grep -F "purview-governance"
          printf '%s\n' 'apiVersion: purview-governance-config/v1' 'target:' '  endpoint: https://contoso-fictional.purview.azure.com' 'authentication:' '  strategy: defaultAzureCredential' 'resources: []' > fictional.yaml
          purview-governance config validate fictional.yaml | grep -F "config valid"
          # Validate the public v2 example from the checkout (examples/ are not in the wheel).
          purview-governance config validate "$GITHUB_WORKSPACE/examples/fictional-governance-config-v2.yaml" | grep -F "config valid"
          python -c "from pathlib import Path; from purview_governance.apply import ExecutionMode, build_execution_result_from_parts; from purview_governance.config import validate_config_text; from purview_governance.plan import build_governance_plan; from purview_governance.remote_state import build_remote_state; cfg=validate_config_text(Path('fictional.yaml').read_text(encoding='utf-8'), format_hint='yaml'); plan=build_governance_plan(cfg, build_remote_state((), ())); Path('plan.json').write_text(plan.to_canonical_json(), encoding='utf-8'); h=plan.plan_identity; result=build_execution_result_from_parts(plan_identity=h, planned_target_context_identity=plan.target_context.identity, execution_target_context_identity=plan.target_context.identity, planned_remote_state_identity=plan.identities.remote_state, observed_remote_state_identity=plan.identities.remote_state, mode=ExecutionMode.DRY_RUN, status='dry-run-ready', writes_performed=0, writes_attempted=0, writes_unknown=0, operations=(), failure=None); Path('result.json').write_text(result.to_canonical_json(), encoding='utf-8'); print('artifacts-ok', plan.plan_identity, result.result_identity)"
          purview-governance plan inspect plan.json | grep -F "planIdentity:"
          purview-governance result inspect result.json | grep -F "resultIdentity:"
          purview-governance plan inspect plan.json --json | python -c "import json,sys; d=json.load(sys.stdin); assert d['apiVersion']=='purview-governance-plan/v1'"
          purview-governance result inspect result.json --json | python -c "import json,sys; d=json.load(sys.stdin); assert d['apiVersion']=='purview-execution-result/v1'"
          set +e
          purview-governance --definitely-not-a-flag
          status=$?
          set -e
          test "$status" -ne 0
          test "$status" -eq 2
