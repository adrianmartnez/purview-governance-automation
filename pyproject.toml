[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "purview-governance-automation"
dynamic = ["version"]
description = "Microsoft Purview Governance-as-Code in Python: versioned config, remote-state, plan and execution-result contracts (v1-v3), Entra authentication, Scanning and Unified Catalog Public Preview adapters, deterministic diff, controlled apply and CLI workflows."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "adrianmartnez" }]
dependencies = [
    "PyYAML>=6.0.1",
    "jsonschema>=4.22",
    "azure-identity>=1.19.0",
    "azure-core>=1.31.0",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "build>=1.2",
]

[project.scripts]
purview-governance = "purview_governance.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
purview_governance = [
    "config/schemas/*.json",
    "remote_state/schemas/*.json",
    "plan/schemas/*.json",
    "apply/schemas/*.json",
]

[tool.setuptools.dynamic]
version = { attr = "purview_governance.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "api_contract: offline Purview API contract tests against local loopback servers (Scanning Data Plane and Unified Catalog; not live Microsoft Purview validation)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
