[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "purview-governance-automation"
dynamic = ["version"]
description = "Microsoft Purview governance automation: versioned config contract and installable Python package. Purview API clients are not implemented yet."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "fgnfmackk" }]
dependencies = [
    "PyYAML>=6.0.1",
    "jsonschema>=4.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "build>=1.2",
]

[project.scripts]
purview-governance = "purview_governance.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
purview_governance = ["config/schemas/*.json"]

[tool.setuptools.dynamic]
version = { attr = "purview_governance.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "api_contract: offline contract-lane harness readiness (not Purview API validation)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
